<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=768, initial-scale=1">
  <title>Trilo - Tipo de consumo</title>
  <link rel="stylesheet" href="telaTipoConsumo.css">
</head>
<body>

  <main class="tela">

    <button type="button" id="btnVoltar" class="btn-voltar">Voltar</button>

    <!-- Logo: salve o arquivo em img/logo-trilo.png (se não existir, aparece o texto) -->
    <div class="logo-area">
      <img src="img/logo-trilo.png" alt="Trilo" class="logo" id="logo">
      <span class="logo-texto" id="logoTexto" hidden>Trilo</span>
    </div>

    <section class="painel">
      <h1 class="titulo">Escolha</h1>

      <div class="opcoes">
        <button type="button" id="btnComerAgora" class="opcao">Comer agora</button>
        <button type="button" id="btnAgendar" class="opcao">Agendar pedido</button>
      </div>
    </section>

  </main>

  <script src="telaTipoConsumo.js"></script>
</body>
</html>
