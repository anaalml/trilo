<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=768, initial-scale=1">
  <title>Trilo - Toque para começar</title>
  <link rel="stylesheet" href="telaDescanso.css">
</head>
<body>

  <main class="tela">

    <!-- Fundo e Manchas Orgânicas -->
    <div class="fundo-decorativo" aria-hidden="true">
      <img src="/public/images/mancha-superior-direita1.png" alt="" class="mancha mancha-tr">
      <img src="/public/images/mancha-superior-direita2.png" alt="" class="mancha mancha-tr">
      <img src="/public/images/mancha-superior-direita3.png" alt="" class="mancha mancha-tr">

      <img src="/public/images/mancha-inferior-esquerda1.png" alt="" class="mancha mancha-bl">
      <img src="/public/images/mancha-inferior-esquerda2.png" alt="" class="mancha mancha-bl">
      <img src="/public/images/mancha-inferior-esquerda3.png" alt="" class="mancha mancha-bl">

      
      
      
      <!-- Ícones Decorativos -->
      <img src="/public/images/raio.svg" alt="" class="icone-decorativo raio">
      <img src="/public/images/brilho.svg" alt="" class="icone-decorativo brilho-topo">
      <img src="/public/images/explosao.svg" alt="" class="icone-decorativo explosao">
      <img src="/public/images/bomba.svg" alt="" class="icone-decorativo estrela">
    </div>

    <!-- Logo Trilo -->
    <div class="logo-area">
      <img src="/public/images/logo.svg" alt="Trilo" class="logo" id="logo">
      <span class="logo-texto" id="logoTexto" hidden>Trilo</span>
    </div>

    <!-- Barra rosa: Botão para começar -->
    <button type="button" class="barra" id="barra" aria-label="Toque para começar. Arraste para cima ou pressione Enter.">
      <img src="/public/images/icone-botao.svg" alt="" class="barra-icone" aria-hidden="true">
      <span class="barra-texto">Toque para começar</span>
    </button>

  </main>

  <script src="telaDescanso.js"></script>
</body>
</html>
